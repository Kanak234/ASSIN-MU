<!DOCTYPE html>
<!-- index.html — page ka DHAANCHA (structure).
     Design → style.css, dimaag (logic) → script.js -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- phone par sahi fit -->
  <title>SandeshKavach – Scam Message Checker</title>
  <meta name="description" content="SMS ya WhatsApp message paste karo, scam hai ya nahi turant jaano.">
  <link rel="icon" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <img src="assets/logo-mark.svg" alt="KP logo" width="56" height="56">
    <h1>Sandesh<span>Kavach</span></h1>
    <p class="sub">Message paste karo — scam hai ya nahi, 1 second me jaano.</p>

    <!-- user yahan message daalega -->
    <textarea id="msg" rows="5" placeholder="Jaise: Aapka account aaj block ho jayega, turant OTP bhejein…"></textarea>

    <div class="buttons">
      <button id="check">🔍 Check karo</button>
      <button id="sample" class="light">Sample message</button>
    </div>

    <!-- result yahan dikhega (script.js bharega) -->
    <div id="result"></div>
  </main>

  <footer>
    Made by <b>Kanak Prabhakar</b> · BCA (Cyber Security), AISECT University ·
    Fraud hua? Call <b>1930</b> · 🔒 Message kahin bheja nahi jaata
  </footer>

  <script src="script.js"></script> <!-- end me, taaki upar ka HTML pehle ban jaye -->
</body>
</html>
